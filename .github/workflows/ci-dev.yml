name: CI - dev

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore backend/BirdMessage.slnx

      - name: Build
        run: dotnet build backend/BirdMessage.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/BirdMessage.slnx --no-build --configuration Release
