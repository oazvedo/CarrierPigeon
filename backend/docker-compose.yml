services:
  postgres:
    image: postgres:16-alpine
    container_name: carrierpigeon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: carrierpigeon
      POSTGRES_USER: carrierpigeon
      POSTGRES_PASSWORD: carrierpigeon
    ports:
      - "5432:5432"
    volumes:
      - carrierpigeon-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carrierpigeon -d carrierpigeon"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  carrierpigeon-postgres-data:
