services:
  postgres:
    image: postgres:16-alpine
    container_name: carrierpigeon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: carrierpigeon
      POSTGRES_USER: carrierpigeon
      POSTGRES_PASSWORD: carrierpigeon
    ports:
      - "5432:5432"
    volumes:
      - carrierpigeon-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carrierpigeon -d carrierpigeon"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: heidiks/rabbitmq-delayed-message-exchange:latest
    container_name: carrierpigeon-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: carrierpigeon
      RABBITMQ_DEFAULT_PASS: carrierpigeon
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - carrierpigeon-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  carrierpigeon-postgres-data:
  carrierpigeon-rabbitmq-data:
